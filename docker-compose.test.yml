# Throwaway test stack; independent of .env. Run:
#   docker compose -f docker-compose.test.yml run --rm --build test
# The credentials below are test-only and never used in production.

# Own project name, so tests never replace or share volumes with the running portal (REQ-OPS-008).
name: knowlegeportal-test

x-django-env: &django-env
  DJANGO_SECRET_KEY: test-only-secret-key-not-for-production
  PORTAL_ADDRESS: 192.0.2.10
  PORTAL_PORT: "80"
  POSTGRES_DB: portal_test
  POSTGRES_USER: portal
  POSTGRES_PASSWORD: test-only-password

x-proxy: &proxy
  image: portal-test-proxy  # both proxies share one build
  build:
    context: .
    target: proxy
  depends_on:
    web:
      condition: service_healthy
  volumes:
    - media:/srv/media:ro
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null --header 'Host: 192.0.2.10' http://127.0.0.1:8080/health/"]
    interval: 2s
    timeout: 5s
    retries: 15

services:
  test:
    build:
      context: .
      target: dev
    environment:
      <<: *django-env
      PROXY_URL: http://proxy:8080
      FRAMED_PROXY_URL: http://proxy-framed:8080
      LIVE_MEDIA_ROOT: /app/live-media  # the media volume web and the proxies use
    volumes:
      - media:/app/live-media
      - ./.github:/app/.github:ro  # excluded from images; tests check the issue template
    depends_on:
      proxy:
        condition: service_healthy
      proxy-framed:
        condition: service_healthy
    command: ["pytest"]

  # Production image behind both proxies, for end-to-end proxy tests. It migrates the
  # (non-test) database first so tests/test_proxy.py can add rows that it reads.
  web:
    build:
      context: .
      target: runtime
    environment: *django-env
    command: ["sh", "-c", "python manage.py migrate --noinput && exec gunicorn portal.wsgi:application --bind 0.0.0.0:8000"]
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host': '192.0.2.10'}), timeout=5)"]
      interval: 2s
      timeout: 5s
      retries: 15

  proxy:
    <<: *proxy
    environment:
      MAX_UPLOAD_MB: "1"
      MAX_IMAGES_PER_LESSON: "2"

  proxy-framed:
    <<: *proxy
    environment:
      FRAME_ANCESTORS: http://192.0.2.5
      MAX_UPLOAD_MB: "1"
      MAX_IMAGES_PER_LESSON: "2"

  db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: portal_test
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal_test"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  media:
