# Production stack. Values come from .env (see .env.example).
# Only the proxy publishes a port; web and db stay internal.

x-django-env: &django-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  PORTAL_ADDRESS: ${PORTAL_ADDRESS:?set in .env}
  PORTAL_PORT: ${PORTAL_PORT:-80}
  TIME_ZONE: ${TIME_ZONE:-UTC}
  PORTAL_NAME: ${PORTAL_NAME:-Design Quality Log}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
  MAX_IMAGES_PER_LESSON: ${MAX_IMAGES_PER_LESSON:-6}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-25}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-False}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
  POSTGRES_DB: ${POSTGRES_DB:?set in .env}
  POSTGRES_USER: ${POSTGRES_USER:?set in .env}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}

# Cap log size per container (SECURITY.md); the host keeps logs for 90 days.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "10"

services:
  proxy:
    build:
      context: .
      target: proxy
    environment:
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      MAX_IMAGES_PER_LESSON: ${MAX_IMAGES_PER_LESSON:-6}
      PORTAL_ADDRESS: ${PORTAL_ADDRESS:?set in .env}
    ports:
      - "${PORTAL_PORT:-80}:8080"
    volumes:
      - media:/srv/media:ro  # served only after Django's access check
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header \"Host: $$PORTAL_ADDRESS\" http://127.0.0.1:8080/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    logging: *logging

  web:
    build:
      context: .
      target: runtime
    environment: *django-env
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host': os.environ['PORTAL_ADDRESS']}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    logging: *logging

  db:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
  media:
